worker_processes auto;
events { worker_connections 4096; }

http {
  # Resolve service names through Docker's embedded DNS on every request (TTL 10s)
  # instead of once at startup: `docker compose up --build` recreates gateway-api
  # and frontend with new IPs, and a static `upstream {}` would keep answering 502
  # until nginx itself was restarted. proxy_pass with a variable forces re-resolution.
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $host $gateway { default "http://gateway-api:8080"; }
  map $host $web     { default "http://frontend:3000"; }

  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  # Messages requests may carry base64 images / PDFs.
  client_max_body_size 32m;

  # ── Unified entry (local dev: localhost:8080) ─────────────────────────────
  server {
    listen 80;
    server_name _;

    # Anthropic-compatible proxy (Claude Code, Cline, Roo Code). Long-lived SSE.
    location /v1/ {
      proxy_pass $gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/chat/ {
      proxy_pass $gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass $gateway;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / { proxy_pass $web; }
  }

  # ── Production backend — port 9001 ────────────────────────────────────────
  server {
    listen 9001;
    server_name _;

    # Anthropic-compatible proxy: streamed, no edge rate limit (quota is enforced
    # per user by the gateway), long read timeout for slow generations.
    location /v1/messages {
      proxy_pass $gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /v1/chat/ {
      proxy_pass $gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      limit_req zone=api burst=20 nodelay;
      proxy_pass $gateway;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # ── Production frontend — port 9002 ───────────────────────────────────────
  server {
    listen 9002;
    server_name _;

    # Anthropic-compatible proxy (Claude Code, Cline, Roo Code). Long-lived SSE.
    location /v1/ {
      proxy_pass $gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/chat/ {
      proxy_pass $gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass $gateway;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / { proxy_pass $web; }
  }
}
