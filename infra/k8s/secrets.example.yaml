# Apply real secrets with: kubectl create secret generic gateway-secrets ...
# This file documents the keys; NEVER commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: ai-gateway
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=postgres;Database=gateway;Username=gateway;Password=REPLACE"
  ConnectionStrings__Redis: "redis:6379"
  ConnectionStrings__RabbitMq: "amqp://gateway:REPLACE@rabbitmq:5672"
  ConnectionStrings__ClickHouseHttp: "http://clickhouse:8123"                      # admin usage dashboards
  ConnectionStrings__ClickHouse: "Host=clickhouse;Port=8123;Database=default"      # analytics worker
  Jwt__SigningKey: "REPLACE-with-32+-byte-random-secret"
  Encryption__DataKey: "REPLACE-base64-32-bytes"        # `openssl rand -base64 32`; AES-256-GCM key for stored provider credentials
  Anthropic__ApiKey: "sk-ant-REPLACE-or-leave-empty"    # optional platform-wide fallback; orgs connect their own at /admin/providers
  Registration__Enabled: "false"                        # "true" enables self-service org signup at /register
  Registration__InviteCode: ""                          # optional shared secret required by /register when set
  Anthropic__OAuth__ClientId: ""                        # OAuth client Anthropic issued to YOUR org; leave empty to disable browser login
  Anthropic__OAuth__ClientSecret: ""                    # omit for public (PKCE-only) clients
  Anthropic__OAuth__AuthorizeUrl: ""                    # provider authorization endpoint (absolute URL)
  Anthropic__OAuth__TokenUrl: ""                        # provider token endpoint (absolute URL)
  Anthropic__OAuth__Scopes: ""                          # space-separated scopes requested at login
  Anthropic__OAuth__RedirectUri: ""                     # https://<gateway host>/admin/providers/callback, as registered with the provider
  WhatsApp__BotUrl: "http://whatsapp-bot:3000"
  WhatsApp__ApiKey: "REPLACE"
